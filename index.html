<!doctype html>
<html lang="zh-CN" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="connect-src 'none'; form-action 'none'; object-src 'none'; base-uri 'none'">
  <title>翻译语料查看器</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="corpus.js"></script>
  <script defer src="viewer.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>翻译语料查看器</h1>
      <p>导入本地 JSONL 或 CSV。编辑暂存在当前页面，导出后即可保存。</p>
    </header>
    <section class="workspace" aria-label="语料工作区">
      <div class="toolbar">
        <label>导入 JSONL 或 CSV
          <input id="import" type="file" accept=".jsonl,.csv">
        </label>
        <label>搜索
          <input id="search" type="search" placeholder="原文、译文、上下文或 ID" autocomplete="off" spellcheck="false" disabled>
        </label>
        <label>筛选
          <select id="filter" disabled>
            <option value="all">全部词条</option>
            <option value="issues">校验有提示</option>
            <option value="untranslated">未翻译</option>
            <option value="edited">已编辑</option>
          </select>
        </label>
        <div class="downloads">
          <button id="jsonl" type="button" disabled>导出 JSONL</button>
          <button id="csv" type="button" disabled>导出 CSV</button>
        </div>
      </div>
      <div class="summary">
        <p id="status" role="status">选择要编辑的文件。</p>
        <p id="count" aria-live="polite"></p>
      </div>
      <p id="empty">可以先导入 examples 目录中的虚构样例。</p>
      <div class="table-scroll" id="table-scroll" hidden>
        <table>
          <thead>
            <tr>
              <th scope="col">ID / 上下文</th>
              <th scope="col">原文</th>
              <th scope="col">译文</th>
              <th scope="col">校验</th>
              <th scope="col">操作</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
    <footer>仅处理你有权使用的数据。本工具在本机运行，与任何翻译平台无隶属关系。按现状提供，责任限制见随附许可证。</footer>
    <noscript>请启用 JavaScript 以在浏览器中处理本地文件。</noscript>
  </main>
  <dialog id="editor" aria-labelledby="edit-title">
    <form id="edit-form">
      <h2 id="edit-title">编辑译文</h2>
      <p id="edit-source"></p>
      <label for="edit-target">译文</label>
      <textarea id="edit-target" rows="5" autocomplete="off" spellcheck="false" autofocus></textarea>
      <div class="dialog-actions">
        <button id="cancel" type="button">取消</button>
        <button type="submit">保存译文</button>
      </div>
    </form>
  </dialog>
</body>
</html>
